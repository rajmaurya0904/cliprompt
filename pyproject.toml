[project]
name = "cliprompt"
version = "0.1.0"
description = "A Claude Code skill that suggests command-line completions based on recent history and context, reducing typing."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cliprompt = "cliprompt.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cliprompt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
